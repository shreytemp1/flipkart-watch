[package]
name = "fkwatch"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Watch Flipkart listings for pincode availability and report to Telegram"
license = "MIT"

[lib]
name = "fkwatch"
path = "src/lib.rs"

[[bin]]
name = "fkwatch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
