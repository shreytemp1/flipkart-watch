name: flipkart-watch

on:
  schedule:
    # GitHub's scheduler floor is 5 minutes. Two checks per 6-minute run
    # (t=0 and t=3 min) give an effective 3-minute cadence.
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flipkart-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Restore watcher state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: fkwatch-state-${{ github.run_id }}
          restore-keys: |
            fkwatch-state-

      - name: Check availability and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          rc1=0
          python -m fkwatch || rc1=$?
          sleep 180
          rc2=0
          python -m fkwatch || rc2=$?
          # The latest check decides the workflow status; the first error was already reported to Telegram.
          exit "$rc2"

      - name: Save watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: fkwatch-state-${{ github.run_id }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}
          path: result.json
          if-no-files-found: ignore
          retention-days: 3
